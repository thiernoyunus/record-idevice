name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    name: Swift build + logic checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: swift build -c release
      - name: Editor logic checks
        run: .build/release/RecordIphone --editor-logic-check
      - name: AirPlay edge checks
        run: .build/release/RecordIphone --airplay-edge-test

  app:
    name: App bundle (build.sh)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install AirPlay helper dependencies
        run: brew install cmake pkg-config openssl@3 libplist
      - name: Build app bundle
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/libplist/lib/pkgconfig
          OPENSSL_ROOT_DIR: /opt/homebrew/opt/openssl@3
        run: ./build.sh
      - name: Verify bundle
        run: |
          test -x "dist/Record iPhone.app/Contents/MacOS/Record iPhone"
          test -x "dist/Record iPhone.app/Contents/MacOS/airplay-helper"
          codesign --verify --deep --strict "dist/Record iPhone.app"
          plutil -lint "dist/Record iPhone.app/Contents/Info.plist"
      - name: Zip app for download
        # ditto keeps the code signature and bundle structure intact.
        run: ditto -c -k --keepParent "dist/Record iPhone.app" "dist/Record-iPhone.zip"
      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Record-iPhone-app
          path: dist/Record-iPhone.zip
          retention-days: 14
